[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checkcardionet"
version = "0.1.0"
description = "Predict ICI-driven cardiovascular acceleration risk and individualize ICI recommendations from a tumor checkpoint expression profile."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CheckCardioNet Authors"}
]
keywords = [
    "immune-checkpoint",
    "cardio-oncology",
    "ICI",
    "myocarditis",
    "cardiotoxicity",
    "drug-recommendation",
    "precision-oncology",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.12",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.urls]
Homepage      = "https://github.com/liuxudr/CheckCardioNet"
Documentation = "https://github.com/liuxudr/CheckCardioNet#readme"
Issues        = "https://github.com/liuxudr/CheckCardioNet/issues"
Source        = "https://github.com/liuxudr/CheckCardioNet"
Changelog     = "https://github.com/liuxudr/CheckCardioNet/blob/main/CHANGELOG.md"

[project.scripts]
checkcardionet = "checkcardionet.cli:app"

# ── Hatch packaging ────────────────────────────────────────────────────────
# Bundle configs/ + pretrained parquet files into the wheel so the tool
# works out of the box right after `pip install` from GitHub.
[tool.hatch.build.targets.wheel]
packages = ["src/checkcardionet"]

[tool.hatch.build.targets.wheel.force-include]
"src/checkcardionet/configs"           = "checkcardionet/configs"
"src/checkcardionet/data/pretrained"   = "checkcardionet/data/pretrained"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
