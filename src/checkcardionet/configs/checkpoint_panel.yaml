# CheckCardioNet immune-checkpoint gene panel.
# ~52 genes covering both tumor and cardiovascular biology, organized into:
#   adaptive_inhibitory, inhibitory_ligands, innate_checkpoints,
#   efferocytosis_regulators, costimulatory, inflammation_cardiovascular.

adaptive_inhibitory:
  - PDCD1      # PD-1
  - CTLA4      # CTLA-4
  - LAG3       # LAG-3
  - HAVCR2     # TIM-3
  - TIGIT
  - BTLA
  - VSIR       # VISTA
  - CD160
  - LAIR1
  - KLRG1
  - CD244      # 2B4

inhibitory_ligands:
  - CD274      # PD-L1
  - PDCD1LG2   # PD-L2
  - LGALS9     # Galectin-9 (TIM-3 ligand)
  - PVR        # CD155 (TIGIT ligand)
  - NECTIN2    # CD112 (TIGIT ligand)
  - CD276      # B7-H3
  - VTCN1      # B7-H4
  - HHLA2      # B7-H7
  - FGL1       # LAG-3 ligand
  - SIGLEC15

innate_checkpoints:
  - CD47       # "don't eat me" signal
  - SIRPA      # SIRPalpha (CD47 receptor)
  - SIRPB1
  - LILRB1     # CD85j
  - LILRB2     # CD85d
  - LILRB4
  - SIGLEC9
  - SIGLEC10
  - KLRC1      # NKG2A
  - KLRD1      # CD94
  - CD96

efferocytosis_regulators:
  # CVD-relevant; bidirectionally linked with tumor biology
  - MERTK      # TAM receptor, key efferocytosis driver
  - AXL        # TAM receptor; also implicated in ICI resistance
  - TYRO3      # TAM receptor
  - GAS6       # TAM ligand (bridges apoptotic cell PS)
  - PROS1      # TAM ligand
  - STAB2      # Phosphatidylserine receptor
  - TIMD4      # TIM-4; recognizes apoptotic cells
  - LRP1       # Scavenger receptor; plaque clearance

costimulatory:
  - CD28
  - ICOS
  - ICOSLG
  - TNFRSF4    # OX40
  - TNFRSF9    # 4-1BB
  - CD40LG     # CD154
  - CD40
  - TNFRSF18   # GITR
  - CD226      # DNAM-1

inflammation_cardiovascular:
  # Cardiovascular inflammatory mediators that intersect with checkpoint biology
  - IL6
  - TNF
  - IFNG
  - IL1B
  - NLRP3
  - CASP1
  - VCAM1      # Vascular adhesion molecule; key in atherosclerosis
  - ICAM1
  - SELE       # E-selectin

